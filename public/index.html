<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buscador Organigrama GCBA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Buscador Organigrama GCBA</h1>

        <p>
            Consultá organismos, cargos y dependencias del organigrama.
        </p>
    </header>

    <main>

        <section class="busqueda">

            <input
                id="txtBuscar"
                type="text"
                placeholder="Buscar organismo, cargo o palabra..."
                autocomplete="off">

            <button
                id="btnBuscar"
                type="button">
                Buscar
            </button>

        </section>

        <section id="resultados">

            <div class="item">
                Ingrese un término para buscar.
            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
